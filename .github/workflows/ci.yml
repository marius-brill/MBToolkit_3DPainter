name: Unit tests and compile checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: python -m pytest -q
      - run: python -m compileall -q painter_python/plugins/MBToolkit_3DPainter
      - run: ruff check painter_python/plugins/MBToolkit_3DPainter tests
