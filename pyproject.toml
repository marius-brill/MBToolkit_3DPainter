[project]
name = "mbtoolkit-3dpainter"
version = "0.1.0"
description = "Modular Adobe Substance 3D Painter plugin"
authors = [{name="Marius Brill"}]
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.ignore = ["E501"]
lint.select = ["E4", "E7", "E9", "F"]
